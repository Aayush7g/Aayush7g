name: Update Featured Projects

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  update-projects:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Featured Projects section from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/update_projects.py

      - name: Commit changes if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update featured projects"
          file_pattern: README.md